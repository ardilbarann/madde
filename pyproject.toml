[project]
name = "madde"
version = "0.1.0"
description = "Citation-grounded assistant for Turkish building regulations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.0.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=6.2.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Postgres with pgvector (DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
