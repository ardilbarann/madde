services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: madde
      POSTGRES_PASSWORD: madde
      POSTGRES_DB: madde
    ports: ["5442:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madde"]
      interval: 2s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://madde:madde@db:5432/madde
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
